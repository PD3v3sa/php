<!DOCTYPE html>
<html lang="es">
<head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Formulario de Información</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <h1>Formulario de Información</h1>
<div class="container-sm p-3 mb-3 bg-secondary text-white border border-primary">
    <form action="validacion.php" method="post">
         
        <div class="col-md-3">      
            <label for="nombre" class="form-label">Nombre y apellidos:</label>
            <input type="text"  class="form-control" id="nombre" name="nombre" required><br><br>
        </div>
        <div class="col-md-3">   
            <label class="form-label" for="email">Email:</label>
            <input type="email" class="form-control" id="email" name="email" required><br><br>
        </div>
        <div class="col-md-3">    
            <label class="form-label" for="url">URL página personal:</label>
            <input type="url" class="form-control"  id="url" name="url"><br><br>
        </div> 
        <div class="row g-3">
            <div class="col">
                <label>Sexo:</label>
                <div class="mb-3 form-check">         
                    <input type="radio" class="form-check-control"  id="masculino" name="sexo" value="Masculino" required>
                    <label class="form-check-label" for="masculino">Masculino</label>
                </div>  
                <div class="mb-3 form-check">
                    <input type="radio" class="form-check-control"  id="femenino" name="sexo" value="Femenino">
                    <label class="form-check-label" for="femenino">Femenino</label><br><br>
                </div>
            </div>
            <div class="col">
                <label>Aficiones:</label><br> 
                <div class="mb-3 form-check">
                   
                        <label class="form-check-label" for="deporte">Deporte</label>
                        <input type="checkbox" class="form-check-input"  id="deporte" name="aficiones[]" value="Deporte">
                </div>       
      
                <div class="mb-3 form-check">
                    <label class="form-check-label" for="musica">Música</label>
                    <input type="checkbox" class="form-check-input"  id="musica" name="aficiones[]" value="Música">
                </div>
                        
                <div class="mb-3 form-check">
                    <label class="form-check-label" for="musica">Lectura</label>
                    <input type="checkbox" class="form-check-input" id="lectura" name="aficiones[]" value="Lectura">
                </div> 
        
                <div class="mb-3 form-check">
                    <label class="form-check-label" for="viajes">Viajes</label>
                    <input type="checkbox" class="form-check-input"  id="viajes" name="aficiones[]" value="Viajes">
                </div>
    
            </div>
            <div class="col">
                     
                    <label class="form-label" for="menu">Menú favorito:</label><br>
                    <select class="col-md-3"  id="menu" name="menu[]" multiple required>
                        <option value="Pizza">Pizza</option>
                        <option value="Pasta">Pasta</option>
                        <option value="Sushi">Sushi</option>
                        <option value="Tacos">Tacos</option>
                    </select><br><br>

            </div>
            
        </div>
        
        <div class="col-md-3">   
            <label class="form-label" for="convivientes">Número de convivientes en el domicilio:</label>
            <input type="number" class="form-control"  id="convivientes" name="convivientes" min="1" required><br><br>
       </div>

       <div class="d-flex flex-row-reverse">
        <button type="submit" class="btn btn-primary btn-lg">Enviar</button>

       </div>
      
        
           
    </form>
</div>
</body>
</html>
